<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080b" />
  <title>Black Russia — Симулятор жизни</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header>
      <div class="logo">🔴 BLACK<span>RUSSIA</span></div>
      <div class="header-stats">
        <div class="stat-pill money" title="Баланс">
          <span>💰</span><span id="hdr-money">0 ₽</span>
        </div>
        <div class="stat-pill" title="Уровень">
          <span>⭐</span><span id="hdr-level">Ур. 1</span>
        </div>
      </div>
    </header>

    <!-- TABS -->
    <nav class="tabs">
      <button class="tab active" data-tab="profile">👤 Профиль</button>
      <button class="tab" data-tab="jobs">💼 Работы</button>
      <button class="tab" data-tab="cars">🚗 Машины</button>
      <button class="tab" data-tab="property">🏠 Жильё</button>
    </nav>

    <!-- CONTENT -->
    <main>
      <section id="tab-profile" class="tab-content active"></section>
      <section id="tab-jobs" class="tab-content"></section>
      <section id="tab-cars" class="tab-content"></section>
      <section id="tab-property" class="tab-content"></section>
    </main>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">Подтверждение</h3>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Отмена</button>
        <button class="btn btn-primary" id="modal-confirm">Купить</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
